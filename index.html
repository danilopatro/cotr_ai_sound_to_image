<script>
    // 1. Inicia a lista vazia
    let timelineCartas = [];
    const cardName = document.getElementById('card-name');

    // 2. Avisa o usuário que está carregando
    cardName.textContent = "Carregando dados do servidor Python...";

    // 3. Faz a requisição para a sua API Python
    fetch('http://localhost:5000/api/timeline')
        .then(response => response.json()) // Transforma a resposta em JSON
        .then(dadosDoPython => {
            // 4. Alimenta a nossa timeline com os dados reais
            timelineCartas = dadosDoPython;
            cardName.textContent = "Dados carregados! Aperte o Play.";
            console.log("Cartas carregadas:", timelineCartas);
        })
        .catch(erro => {
            console.error("Erro ao conectar com o Python:", erro);
            cardName.textContent = "Erro ao conectar com o servidor.";
        });

    // 5. O resto do código continua igual, ouvindo o áudio
    const audioPlayer = document.getElementById('podcast-audio');
    const cardImage = document.getElementById('card-image');
    let cartaAtualIndex = -1;

    audioPlayer.addEventListener('timeupdate', () => {
        // Se a timeline ainda estiver vazia, não faz nada
        if (timelineCartas.length === 0) return;

        const tempoAtual = audioPlayer.currentTime;
        
        let indexCorreto = -1;
        for (let i = 0; i < timelineCartas.length; i++) {
            if (tempoAtual >= timelineCartas[i].tempo_segundos) {
                indexCorreto = i;
            } else {
                break;
            }
        }

        if (indexCorreto !== cartaAtualIndex) {
            cartaAtualIndex = indexCorreto;

            if (cartaAtualIndex !== -1) {
                const cartaDaVez = timelineCartas[cartaAtualIndex];
                cardImage.src = cartaDaVez.url;
                cardImage.style.display = 'block';
                cardName.textContent = cartaDaVez.nome;
            } else {
                cardImage.style.display = 'none';
                cardImage.src = '';
                cardName.textContent = 'Aperte o Play...';
            }
        }
    });
</script>
