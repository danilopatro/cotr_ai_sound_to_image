<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cardboard of the Rings - AI Player (Teste)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #1a1a1a;
            color: #f1f1f1;
            padding: 40px;
        }
        .player-container {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        #card-display {
            margin-top: 20px;
            height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #card-image {
            max-height: 100%;
            max-width: 100%;
            border-radius: 8px;
            display: none; 
        }
        #card-name {
            margin-top: 10px;
            font-weight: bold;
            color: #eebb55; 
        }
    </style>
</head>
<body>

    <div class="player-container">
        <h2>Episódio Teste</h2>
        
        <!-- O Player de Áudio com um MP3 de teste real -->
        <audio id="podcast-audio" controls>
            <source src="https://traffic.libsyn.com/cotr/Cardboard_of_the_Rings_256.mp3" type="audio/mpeg">
            Seu navegador não suporta o elemento de áudio.
        </audio>

        <div id="card-display">
            <img id="card-image" src="" alt="Imagem da carta">
            <div id="card-name">Aperte o Play e aguarde 3 segundos...</div>
        </div>
    </div>

    <script>
        // Tempos reduzidos para você testar rapidamente (3s, 6s e 9s)
        const timelineCartas = [
            { tempo_segundos: 10, nome: "Steward of Gondor", url: "https://ringsdb.com/bundles/cards/01026.png" },
            { tempo_segundos: 20, nome: "A Test of Will", url: "https://ringsdb.com/bundles/cards/01050.png" },
            { tempo_segundos: 9, nome: "Gandalf", url: "https://ringsdb.com/bundles/cards/01073.png" }
        ];

        const audioPlayer = document.getElementById('podcast-audio');
        const cardImage = document.getElementById('card-image');
        const cardName = document.getElementById('card-name');

        let cartaAtualIndex = -1;

        audioPlayer.addEventListener('timeupdate', () => {
            const tempoAtual = audioPlayer.currentTime;
            
            let indexCorreto = -1;
            for (let i = 0; i < timelineCartas.length; i++) {
                if (tempoAtual >= timelineCartas[i].tempo_segundos) {
                    indexCorreto = i;
                } else {
                    break;
                }
            }

            if (indexCorreto !== cartaAtualIndex) {
                cartaAtualIndex = indexCorreto;

                if (cartaAtualIndex !== -1) {
                    const cartaDaVez = timelineCartas[cartaAtualIndex];
                    cardImage.src = cartaDaVez.url;
                    cardImage.style.display = 'block';
                    cardName.textContent = cartaDaVez.nome;
                } else {
                    cardImage.style.display = 'none';
                    cardImage.src = '';
                    cardName.textContent = 'Aperte o Play e aguarde 3 segundos...';
                }
            }
        });
    </script>
</body>
</html>
