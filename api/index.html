<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cardboard of the Rings - AI Player</title>
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #1a1a1a;
            color: #f1f1f1;
            padding: 40px;
            margin: 0;
        }

        /* --- Layout separating the screen into two columns --- */
        .layout-wrapper {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1300px; 
            align-items: flex-start;
        }

        /* --- Main Player Container --- */
        .player-container {
            flex: 1; 
            min-width: 0; /* Prevents overflow */
            background: #2a2a2a;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
        }
        
        .player-container h2 {
            margin-bottom: 5px;
            color: #eebb55;
        }
        
        .player-container h4 {
            margin-top: 0;
            margin-bottom: 25px;
            color: #aaa;
            font-weight: normal;
        }

        /* --- Sidebar Styles --- */
        .sidebar {
            width: 280px;
            background: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-height: 75vh;
            overflow-y: auto;
            flex-shrink: 0; 
        }

        /* Custom scrollbar for an elegant sidebar */
        .sidebar::-webkit-scrollbar { width: 8px; }
        .sidebar::-webkit-scrollbar-track { background: #1a1a1a; border-radius: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        .sidebar::-webkit-scrollbar-thumb:hover { background: #777; }

        .sidebar h3 {
            margin-top: 0;
            color: #eebb55;
            text-align: center;
            border-bottom: 1px solid #444;
            padding-bottom: 15px;
        }

        .sidebar-item {
            padding: 12px;
            border-bottom: 1px solid #333;
            cursor: pointer;
            transition: all 0.2s ease;
            border-left: 4px solid transparent; 
        }
        
        .sidebar-item:hover { background: #333; }

        .sidebar-item.active {
            background: #1f1f1f;
            border-left: 4px solid var(--glow-color); /* Edge painted with the sphere's color */
        }

        .sidebar-item.active .sidebar-name {
            color: #fff;
            font-weight: bold;
        }

        .sidebar-time {
            font-size: 0.85em;
            color: #888;
            font-family: monospace;
            background: #111;
            padding: 3px 8px;
            border-radius: 6px;
        }

        .sidebar-name {
            display: block;
            margin-top: 6px;
            font-size: 0.95em;
            color: #ccc;
        }

        #status-message {
            margin: 15px 0;
            font-weight: bold;
            color: #eebb55;
            font-size: 1.2em;
        }

        /* --- Carousel Styles --- */
        .carousel {
            position: relative; 
            display: flex;
            overflow-x: auto;
            gap: 30px; 
            padding: 60px 20px; 
            width: 100%;
            align-items: center; 
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .carousel::-webkit-scrollbar { display: none; }

        /* --- Base Card Style --- */
        .card-item {
            flex: 0 0 auto; 
            opacity: 0.4; 
            transform: scale(0.9);
            transition: all 0.4s ease-in-out;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card-images-wrapper {
            display: flex;
            gap: 15px; 
            justify-content: center;
        }

        .card-item img {
            width: 280px; 
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.6);
            object-fit: contain;
        }

        /* --- Style for Double/Split Cards (like Quests) --- */
        .split-card {
            width: 280px;
            height: 392px; 
            background-size: 100% 200%; 
            background-repeat: no-repeat;
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.6);
        }

        .card-name {
            margin-top: 15px;
            font-size: 1.1em;
            color: #ccc;
            transition: all 0.4s ease;
            text-align: center;
            max-width: 90%;
        }
        
        .card-time {
            font-size: 0.9em;
            color: #888;
            background: #111;
            padding: 5px 12px;
            border-radius: 15px;
            display: inline-block;
            margin-top: 8px;
            margin-bottom: 12px; 
            font-family: monospace; 
        }

        /* --- RingsDB Link Styles --- */
        .ringsdb-links {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
        }

        .ringsdb-btn {
            font-size: 0.8em;
            color: #ffffff; 
            text-decoration: none;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            transition: all 0.2s ease;
            display: inline-block;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5); 
        }

        .ringsdb-btn:hover {
            filter: brightness(1.2); 
            transform: scale(1.05);
        }

        /* --- ACTIVE Card Style --- */
        .card-item.active {
            opacity: 1;
            transform: scale(1.12); 
            filter: drop-shadow(0 0 25px var(--glow-color)); 
            z-index: 10;
        }
        
        .card-item.active .card-name {
            color: #ffffff; 
            font-weight: bold;
            font-size: 1.2em;
            text-shadow: 0 0 8px var(--glow-color);
        }

        /* Responsiveness for smaller screens */
        @media (max-width: 950px) {
            .layout-wrapper { flex-direction: column; }
            .sidebar { width: 100%; max-height: 350px; box-sizing: border-box; }
        }
    </style>
</head>
<body>

    <div class="layout-wrapper">
        <!-- Left Side: Main Player -->
        <div class="player-container">
            <h2>Episode 256</h2>
            <h4>Seastan and Dale vs Evil</h4>
            
            <audio id="podcast-audio" controls style="width: 100%;">
                <source src="https://traffic.libsyn.com/cotr/Cardboard_of_the_Rings_256.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>

            <div id="status-message">Loading timeline...</div>
            <div id="carousel-container" class="carousel"></div>
        </div>

        <!-- Right Side: Vertical Index -->
        <div class="sidebar">
            <h3>Card Index</h3>
            <div id="sidebar-list"></div>
        </div>
    </div>

    <script>
        let groupedTimeline = [];
        let currentCardIndex = -1;
        
        const statusMessage = document.getElementById('status-message');
        const carousel = document.getElementById('carousel-container');
        const audioPlayer = document.getElementById('podcast-audio');
        const sidebarList = document.getElementById('sidebar-list');

        function formatTime(totalSeconds) {
            if (isNaN(totalSeconds)) return "00:00:00";
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = Math.floor(totalSeconds % 60);
            return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function getSphereColor(sphere) {
            const colors = {
                'leadership': '#ad62a5', 
                'tactics': '#c00106',    
                'spirit': '#00b1d4',     
                'lore': '#51b848',       
                'neutral': '#616161',    
                'fellowship': '#b56c0c', 
                'baggins': '#b39e26'     
            };
            return colors[sphere?.toLowerCase()] || '#eebb55';
        }

        // Transforms vertical mouse wheel scroll into horizontal carousel scroll
        carousel.addEventListener('wheel', (evt) => {
            evt.preventDefault(); 
            carousel.scrollLeft += evt.deltaY; 
        });

        fetch('/api/timeline')
            .then(response => {
                if (!response.ok) throw new Error(`Error: ${response.status}`);
                return response.json();
            })
            .then(rawData => {
                const groupedMap = {};
                
                // Keep mapping the original JSON keys (tempo_segundos, nome, esfera) 
                // to maintain compatibility with the Python backend output.
                rawData.forEach(card => {
                    const time = parseInt(card.tempo_segundos);
                    if (isNaN(time)) return;

                    if (!groupedMap[time]) {
                        groupedMap[time] = { time_seconds: time, cards: [] };
                    }
                    // Prevent exact duplicates in the same second
                    if (!groupedMap[time].cards.some(c => c.nome === card.nome)) {
                        groupedMap[time].cards.push(card);
                    }
                });

                // Sort timeline chronologically
                groupedTimeline = Object.values(groupedMap).sort((a, b) => a.time_seconds - b.time_seconds);

                // =========================================================
                // 💡 NEW LOGIC: Filter out consecutive mentions of the same card
                // =========================================================
                const COOLDOWN_SECONDS = 60; // Time window to ignore repeated cards
                let lastSeenMemory = {};
                let cleanedTimeline = [];

                groupedTimeline.forEach(group => {
                    let validCards = [];

                    group.cards.forEach(card => {
                        let lastSeenTime = lastSeenMemory[card.nome];

                        // If the card is new, OR enough time has passed since its last mention
                        if (lastSeenTime === undefined || (group.time_seconds - lastSeenTime) > COOLDOWN_SECONDS) {
                            validCards.push(card);
                            lastSeenMemory[card.nome] = group.time_seconds; // Update memory with current time
                        }
                    });

                    // If the group still has cards after filtering, add it to the final timeline
                    if (validCards.length > 0) {
                        group.cards = validCards;
                        cleanedTimeline.push(group);
                    }
                });

                groupedTimeline = cleanedTimeline; // Replace with the clean version
                // =========================================================

                if (groupedTimeline.length === 0) {
                    statusMessage.textContent = "No cards found.";
                    return;
                }

                statusMessage.textContent = `${groupedTimeline.length} moments synced. Press Play!`;
                
                groupedTimeline.forEach((group, index) => {
                    
                    // 1. CAROUSEL CARDS CREATION
                    const cardDiv = document.createElement('div');
                    cardDiv.className = 'card-item';
                    cardDiv.id = `card-${index}`;
                    
                    const mainColor = getSphereColor(group.cards[0].esfera);
                    cardDiv.style.setProperty('--glow-color', mainColor);
                    
                    let namesHTML = group.cards.map(c => c.nome).join(' & ');
                    
                    cardDiv.innerHTML = `
                        <div class="card-images-wrapper"></div>
                        <div class="card-name">${namesHTML}</div>
                        <div class="card-time">${formatTime(group.time_seconds)}</div>
                        <div class="ringsdb-links"></div>
                    `;

                    const imageWrapper = cardDiv.querySelector('.card-images-wrapper');
                    const linksWrapper = cardDiv.querySelector('.ringsdb-links');

                    group.cards.forEach(card => {
                        const safeUrl = card.url ? card.url : '';
                        const cardColor = getSphereColor(card.esfera);
                        
                        if (safeUrl) {
                            const img = document.createElement('img');
                            img.src = safeUrl;
                            img.alt = card.nome;

                            // Splits unusually tall images (e.g. Quests) into two side-by-side halves
                            img.onload = function() {
                                if (this.naturalHeight > this.naturalWidth * 1.8) {
                                    const doubleContainer = document.createElement('div');
                                    doubleContainer.style.display = 'flex';
                                    doubleContainer.style.gap = '15px';
                                    
                                    const topHalf = document.createElement('div');
                                    topHalf.className = 'split-card';
                                    topHalf.style.backgroundImage = `url('${this.src}')`;
                                    topHalf.style.backgroundPosition = 'top';
                                    
                                    const bottomHalf = document.createElement('div');
                                    bottomHalf.className = 'split-card';
                                    bottomHalf.style.backgroundImage = `url('${this.src}')`;
                                    bottomHalf.style.backgroundPosition = 'bottom';
                                    
                                    doubleContainer.appendChild(topHalf);
                                    doubleContainer.appendChild(bottomHalf);
                                    
                                    this.replaceWith(doubleContainer);
                                }
                            };
                            imageWrapper.appendChild(img);

                            // RingsDB Link Generation
                            const urlParts = safeUrl.split('/');
                            const imageFile = urlParts[urlParts.length - 1]; 
                            const cardId = imageFile.split('.')[0]; 

                            linksWrapper.innerHTML += `
                                <a href="https://ringsdb.com/card/${cardId}" target="_blank" class="ringsdb-btn" style="background-color: ${cardColor};" onclick="event.stopPropagation();">
                                    View <strong>${card.nome}</strong> on RingsDB
                                </a>
                            `;
                        }
                    });

                    // Clicking the card area jumps the audio
                    cardDiv.addEventListener('click', () => {
                        audioPlayer.currentTime = group.time_seconds;
                        audioPlayer.play();
                    });

                    carousel.appendChild(cardDiv);

                    // 2. SIDEBAR ITEMS CREATION
                    const sidebarItem = document.createElement('div');
                    sidebarItem.className = 'sidebar-item';
                    sidebarItem.id = `sidebar-item-${index}`;
                    sidebarItem.style.setProperty('--glow-color', mainColor);
                    
                    sidebarItem.innerHTML = `
                        <span class="sidebar-time">${formatTime(group.time_seconds)}</span>
                        <span class="sidebar-name">${namesHTML}</span>
                    `;

                    sidebarItem.addEventListener('click', () => {
                        audioPlayer.currentTime = group.time_seconds;
                        audioPlayer.play();
                    });

                    sidebarList.appendChild(sidebarItem);
                });

                // Trigger initial sync to highlight the first card
                audioPlayer.dispatchEvent(new Event('timeupdate'));
            })
            .catch(error => {
                console.error("Error:", error);
                statusMessage.textContent = "Error loading the timeline.";
            });

        // Syncs the carousel and sidebar with the audio playback
        audioPlayer.addEventListener('timeupdate', () => {
            if (groupedTimeline.length === 0) return;

            const currentTime = audioPlayer.currentTime;
            let correctIndex = 0; 
            
            for (let i = 0; i < groupedTimeline.length; i++) {
                if (currentTime >= groupedTimeline[i].time_seconds) {
                    correctIndex = i;
                } else {
                    break;
                }
            }

            if (correctIndex !== currentCardIndex) {
                // UNMARK PREVIOUS ITEM
                if (currentCardIndex !== -1) {
                    const oldCard = document.getElementById(`card-${currentCardIndex}`);
                    if (oldCard) oldCard.classList.remove('active');

                    const oldSidebar = document.getElementById(`sidebar-item-${currentCardIndex}`);
                    if (oldSidebar) oldSidebar.classList.remove('active');
                }

                currentCardIndex = correctIndex;

                // MARK NEW ITEM
                if (currentCardIndex !== -1) {
                    const newCard = document.getElementById(`card-${currentCardIndex}`);
                    if (newCard) {
                        newCard.classList.add('active');
                        const centerPosition = newCard.offsetLeft - (carousel.clientWidth / 2) + (newCard.clientWidth / 2);
                        carousel.scrollTo({ left: centerPosition, behavior: 'smooth' });
                    }

                    const newSidebar = document.getElementById(`sidebar-item-${currentCardIndex}`);
                    if (newSidebar) {
                        newSidebar.classList.add('active');
                        newSidebar.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }
                }
            }
        });
    </script>
</body>
</html>
