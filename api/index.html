<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cardboard of the Rings - AI Player</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #1a1a1a;
            color: #f1f1f1;
            padding: 40px;
            margin: 0;
        }
        .player-container {
            background: #2a2a2a;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            width: 100%;
            max-width: 1000px; 
        }
        
        #status-message {
            margin: 15px 0;
            font-weight: bold;
            color: #eebb55;
            font-size: 1.2em;
        }

        .carousel {
            position: relative; 
            display: flex;
            overflow-x: auto;
            gap: 30px; 
            padding: 60px 20px; 
            width: 100%;
            align-items: center; 
            
            /* Retiramos o scroll-behavior: smooth daqui para não interferir na rodinha do mouse */
            
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .carousel::-webkit-scrollbar {
            display: none;
        }

        /* --- Estilo Base do Card --- */
        .card-item {
            flex: 0 0 auto; 
            opacity: 0.4; 
            transform: scale(0.9);
            transition: all 0.4s ease-in-out;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card-images-wrapper {
            display: flex;
            gap: 15px; 
            justify-content: center;
        }

        .card-item img {
            width: 280px; 
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.6);
            object-fit: contain;
        }

        .card-name {
            margin-top: 15px;
            font-size: 1.1em;
            color: #ccc;
            transition: all 0.4s ease;
            text-align: center;
            max-width: 90%;
        }
        
        .card-time {
            font-size: 0.9em;
            color: #888;
            background: #111;
            padding: 5px 12px;
            border-radius: 15px;
            display: inline-block;
            margin-top: 8px;
            font-family: monospace; 
        }

        /* --- Estilo do Card ATIVO --- */
        .card-item.active {
            opacity: 1;
            transform: scale(1.12); 
            filter: drop-shadow(0 0 25px var(--glow-color)); 
            z-index: 10;
        }
        
        .card-item.active .card-name {
            color: #ffffff; 
            font-weight: bold;
            font-size: 1.2em;
            text-shadow: 0 0 8px var(--glow-color);
        }
    </style>
</head>
<body>

    <div class="player-container">
        <h2>Episódio 227</h2>
        
        <audio id="podcast-audio" controls style="width: 100%;">
            <source src="https://traffic.libsyn.com/cotr/Episode_227_-_QC.mp3" type="audio/mpeg">
            Seu navegador não suporta o elemento de áudio.
        </audio>

        <div id="status-message">Carregando linha do tempo...</div>

        <div id="carousel-container" class="carousel"></div>
    </div>

    <script>
        let timelineAgrupada = [];
        let cartaAtualIndex = -1;
        
        const statusMessage = document.getElementById('status-message');
        const carousel = document.getElementById('carousel-container');
        const audioPlayer = document.getElementById('podcast-audio');

        function formatarTempo(segundosTotais) {
            if (isNaN(segundosTotais)) return "00:00:00";
            const horas = Math.floor(segundosTotais / 3600);
            const minutos = Math.floor((segundosTotais % 3600) / 60);
            const segundos = Math.floor(segundosTotais % 60);
            return `${horas.toString().padStart(2, '0')}:${minutos.toString().padStart(2, '0')}:${segundos.toString().padStart(2, '0')}`;
        }

        function pegarCorDaEsfera(esfera) {
            const cores = {
                'leadership': '#ad62a5', 
                'tactics': '#c00106',    
                'spirit': '#00b1d4',     
                'lore': '#51b848',       
                'neutral': '#616161',    
                'fellowship': '#b56c0c', 
                'baggins': '#b39e26'     
            };
            return cores[esfera?.toLowerCase()] || '#eebb55';
        }

        // 💡 NOVO: Transforma o scroll vertical do mouse em scroll horizontal no carrossel
        carousel.addEventListener('wheel', (evt) => {
            evt.preventDefault(); // Impede a página inteira de rolar para baixo
            carousel.scrollLeft += evt.deltaY; // Move as cartas para os lados
        });

        fetch('/api/timeline')
            .then(response => {
                if (!response.ok) throw new Error(`Erro: ${response.status}`);
                return response.json();
            })
            .then(dadosRaw => {
                const mapaAgrupado = {};
                
                dadosRaw.forEach(carta => {
                    const tempo = parseInt(carta.tempo_segundos);
                    if (isNaN(tempo)) return;

                    if (!mapaAgrupado[tempo]) {
                        mapaAgrupado[tempo] = {
                            tempo_segundos: tempo,
                            cartas: []
                        };
                    }
                    if (!mapaAgrupado[tempo].cartas.some(c => c.nome === carta.nome)) {
                        mapaAgrupado[tempo].cartas.push(carta);
                    }
                });

                timelineAgrupada = Object.values(mapaAgrupado).sort((a, b) => a.tempo_segundos - b.tempo_segundos);

                if (timelineAgrupada.length === 0) {
                    statusMessage.textContent = "Nenhuma carta encontrada.";
                    return;
                }

                statusMessage.textContent = `${timelineAgrupada.length} momentos sincronizados. Aperte o Play!`;
                
                timelineAgrupada.forEach((grupo, index) => {
                    const cardDiv = document.createElement('div');
                    cardDiv.className = 'card-item';
                    cardDiv.id = `card-${index}`;
                    
                    const corPrincipal = pegarCorDaEsfera(grupo.cartas[0].esfera);
                    cardDiv.style.setProperty('--glow-color', corPrincipal);
                    
                    let imagensHTML = '';
                    let nomesHTML = grupo.cartas.map(c => c.nome).join(' & ');

                    grupo.cartas.forEach(carta => {
                        const urlSegura = carta.url ? carta.url : '';
                        imagensHTML += `<img src="${urlSegura}" alt="${carta.nome}">`;
                    });

                    cardDiv.innerHTML = `
                        <div class="card-images-wrapper">
                            ${imagensHTML}
                        </div>
                        <div class="card-name">${nomesHTML}</div>
                        <div class="card-time">${formatarTempo(grupo.tempo_segundos)}</div>
                    `;

                    // Clicar na carta pula o aúdio para o tempo dela e começa a tocar
                    cardDiv.addEventListener('click', () => {
                        audioPlayer.currentTime = grupo.tempo_segundos;
                        audioPlayer.play();
                    });

                    carousel.appendChild(cardDiv);
                });

                audioPlayer.dispatchEvent(new Event('timeupdate'));
            })
            .catch(erro => {
                console.error("Erro:", erro);
                statusMessage.textContent = "Erro ao carregar a timeline.";
            });

        audioPlayer.addEventListener('timeupdate', () => {
            if (timelineAgrupada.length === 0) return;

            const tempoAtual = audioPlayer.currentTime;
            
            let indexCorreto = 0; 
            
            for (let i = 0; i < timelineAgrupada.length; i++) {
                if (tempoAtual >= timelineAgrupada[i].tempo_segundos) {
                    indexCorreto = i;
                } else {
                    break;
                }
            }

            if (indexCorreto !== cartaAtualIndex) {
                if (cartaAtualIndex !== -1) {
                    const cardAntigo = document.getElementById(`card-${cartaAtualIndex}`);
                    if (cardAntigo) cardAntigo.classList.remove('active');
                }

                cartaAtualIndex = indexCorreto;

                if (cartaAtualIndex !== -1) {
                    const cardNovo = document.getElementById(`card-${cartaAtualIndex}`);
                    if (cardNovo) {
                        cardNovo.classList.add('active');
                        
                        const posicaoCentro = cardNovo.offsetLeft - (carousel.clientWidth / 2) + (cardNovo.clientWidth / 2);
                        
                        // A rolagem automática ao mudar a carta continua com animação suave
                        carousel.scrollTo({
                            left: posicaoCentro,
                            behavior: 'smooth'
                        });
                    }
                }
            }
        });
    </script>
</body>
</html>
