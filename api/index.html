<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cardboard of the Rings - AI Player</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #1a1a1a;
            color: #f1f1f1;
            padding: 40px;
        }
        .player-container {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            width: 100%;
            max-width: 500px;
        }
        #card-display {
            margin-top: 20px;
            height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #card-image {
            max-height: 100%;
            max-width: 100%;
            border-radius: 8px;
            display: none; 
        }
        #card-name {
            margin-top: 10px;
            font-weight: bold;
            color: #eebb55; 
        }
    </style>
</head>
<body>

    <div class="player-container">
        <h2>Episódio 256</h2>
        
        <!-- IMPORTANTE: Quando for testar com os dados reais, troque o 'src' abaixo para o link do MP3 do podcast -->
        <audio id="podcast-audio" controls>
            <source src="http://traffic.libsyn.com/cotr/Episode_147_-_spirit_clippin.mp3" type="audio/mpeg">
            Seu navegador não suporta o elemento de áudio.
        </audio>

        <div id="card-display">
            <img id="card-image" src="" alt="Imagem da carta">
            <div id="card-name">Carregando dados do servidor Python...</div>
        </div>
    </div>

    <script>
        let timelineCartas = [];
        const cardName = document.getElementById('card-name');
        const cardImage = document.getElementById('card-image');
        const audioPlayer = document.getElementById('podcast-audio');
        let cartaAtualIndex = -1;

        // 1. Busca os dados reais na sua API da Vercel
        fetch('/api/timeline')
            .then(response => {
                // Checa se a resposta da rede foi bem sucedida (código 200)
                if (!response.ok) {
                    throw new Error(`Erro de rede: status ${response.status}`);
                }
                return response.json();
            })
            .then(dadosDoPython => {
                timelineCartas = dadosDoPython;
                cardName.textContent = "Dados carregados! Aperte o Play.";
                
                // Esta é a linha que vai imprimir no seu Console (F12)
                console.log("Cartas carregadas:", timelineCartas);
            })
            .catch(erro => {
                console.error("Erro ao conectar com a API:", erro);
                cardName.textContent = "Erro ao carregar as cartas da API.";
            });

        // 2. Ouve o relógio do áudio e sincroniza as imagens
        audioPlayer.addEventListener('timeupdate', () => {
            if (timelineCartas.length === 0) return;

            const tempoAtual = audioPlayer.currentTime;
            
            let indexCorreto = -1;
            
            for (let i = 0; i < timelineCartas.length; i++) {
                if (tempoAtual >= timelineCartas[i].tempo_segundos) {
                    indexCorreto = i;
                } else {
                    break;
                }
            }

            // Só atualiza a tela se a carta tiver mudado
            if (indexCorreto !== cartaAtualIndex) {
                cartaAtualIndex = indexCorreto;

                if (cartaAtualIndex !== -1) {
                    const cartaDaVez = timelineCartas[cartaAtualIndex];
                    cardImage.src = cartaDaVez.url;
                    cardImage.style.display = 'block';
                    cardName.textContent = cartaDaVez.nome;
                } else {
                    cardImage.style.display = 'none';
                    cardImage.src = '';
                    cardName.textContent = 'Aguardando menção de cartas...';
                }
            }
        });
    </script>
</body>
</html>
