<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cardboard of the Rings - AI Player</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #1a1a1a;
            color: #f1f1f1;
            padding: 40px;
            margin: 0;
        }
        .player-container {
            background: #2a2a2a;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            width: 100%;
            /* 1. Aumentamos o container de 800px para 1000px para caber as cartas grandes */
            max-width: 1000px; 
        }
        
        #status-message {
            margin: 15px 0;
            font-weight: bold;
            color: #eebb55;
            font-size: 1.2em;
        }

        /* --- Estilos do Carrossel --- */
        .carousel {
            display: flex;
            overflow-x: auto;
            gap: 30px; /* Mais espaço entre as cartas */
            /* 2. Mais padding vertical (60px) para a carta não ser cortada quando der o zoom */
            padding: 60px 20px; 
            scroll-behavior: smooth;
            width: 100%;
            
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .carousel::-webkit-scrollbar {
            display: none;
        }

        /* --- Estilo de cada Carta --- */
        .card-item {
            flex: 0 0 auto; 
            /* 3. Aumentamos a carta de 180px para 280px */
            width: 280px; 
            opacity: 0.4; 
            transform: scale(0.9);
            transition: all 0.4s ease-in-out;
            cursor: pointer;
        }
        .card-item img {
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.6);
        }
        .card-name {
            margin-top: 15px;
            font-size: 1.1em;
            color: #ccc;
        }
        .card-time {
            font-size: 0.9em;
            color: #888;
            background: #111;
            padding: 5px 12px;
            border-radius: 15px;
            display: inline-block;
            margin-top: 8px;
        }

        /* --- Estilo da Carta ATIVA --- */
        .card-item.active {
            opacity: 1;
            /* Quando ativa, ela fica ainda maior (15% a mais que os 280px originais) */
            transform: scale(1.15); 
            filter: drop-shadow(0 0 20px rgba(238, 187, 85, 0.6)); 
            z-index: 10;
        }
        .card-item.active .card-name {
            color: #eebb55;
            font-weight: bold;
            font-size: 1.2em;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <h2>Episódio 257</h2>
        
        <audio id="podcast-audio" controls style="width: 100%;">
            <source src="https://traffic.libsyn.com/cotr/Episode_227_-_QC.mp3" type="audio/mpeg">
            Seu navegador não suporta o elemento de áudio.
        </audio>

        <div id="status-message">Carregando linha do tempo...</div>

        <div id="carousel-container" class="carousel"></div>
    </div>

    <script>
        let timelineCartas = [];
        let cartaAtualIndex = -1;
        
        const statusMessage = document.getElementById('status-message');
        const carousel = document.getElementById('carousel-container');
        const audioPlayer = document.getElementById('podcast-audio');

        function formatarTempo(segundos) {
            const min = Math.floor(segundos / 60);
            const seg = Math.floor(segundos % 60);
            return `${min}:${seg.toString().padStart(2, '0')}`;
        }

        fetch('/api/timeline')
            .then(response => {
                if (!response.ok) throw new Error(`Erro: ${response.status}`);
                return response.json();
            })
            .then(dados => {
                timelineCartas = dados;
                statusMessage.textContent = `${timelineCartas.length} cartas sincronizadas. Aperte o Play!`;
                
                timelineCartas.forEach((carta, index) => {
                    const cardDiv = document.createElement('div');
                    cardDiv.className = 'card-item';
                    cardDiv.id = `card-${index}`;
                    
                    cardDiv.innerHTML = `
                        <img src="${carta.url}" alt="${carta.nome}">
                        <div class="card-name">${carta.nome}</div>
                        <div class="card-time">${formatarTempo(carta.tempo_segundos)}</div>
                    `;

                    cardDiv.addEventListener('click', () => {
                        audioPlayer.currentTime = carta.tempo_segundos;
                        audioPlayer.play();
                    });

                    carousel.appendChild(cardDiv);
                });
            })
            .catch(erro => {
                console.error("Erro:", erro);
                statusMessage.textContent = "Erro ao carregar a timeline.";
            });

        audioPlayer.addEventListener('timeupdate', () => {
            if (timelineCartas.length === 0) return;

            const tempoAtual = audioPlayer.currentTime;
            let indexCorreto = -1;
            
            for (let i = 0; i < timelineCartas.length; i++) {
                if (tempoAtual >= timelineCartas[i].tempo_segundos) {
                    indexCorreto = i;
                } else {
                    break;
                }
            }

            if (indexCorreto !== cartaAtualIndex) {
                
                if (cartaAtualIndex !== -1) {
                    const cartaAntiga = document.getElementById(`card-${cartaAtualIndex}`);
                    if (cartaAntiga) cartaAntiga.classList.remove('active');
                }

                cartaAtualIndex = indexCorreto;

                if (cartaAtualIndex !== -1) {
                    const cartaNova = document.getElementById(`card-${cartaAtualIndex}`);
                    if (cartaNova) {
                        cartaNova.classList.add('active');
                        
                        cartaNova.scrollIntoView({
                            behavior: 'smooth',
                            inline: 'center',
                            block: 'nearest'
                        });
                    }
                }
            }
        });
    </script>
</body>
</html>
