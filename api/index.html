<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cardboard of the Rings - AI Player</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #1a1a1a;
            color: #f1f1f1;
            padding: 40px;
            margin: 0;
        }
        .player-container {
            background: #2a2a2a;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            width: 100%;
            max-width: 1000px; 
        }
        
        #status-message {
            margin: 15px 0;
            font-weight: bold;
            color: #eebb55;
            font-size: 1.2em;
        }

        .carousel {
            position: relative; 
            display: flex;
            overflow-x: auto;
            gap: 30px; 
            padding: 60px 20px; 
            scroll-behavior: smooth;
            width: 100%;
            
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .carousel::-webkit-scrollbar {
            display: none;
        }

        /* --- Estilo Base da Carta --- */
        .card-item {
            flex: 0 0 auto; 
            width: 280px; 
            opacity: 0.4; 
            transform: scale(0.9);
            transition: all 0.4s ease-in-out;
            cursor: pointer;
        }
        .card-item img {
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.6);
        }
        .card-name {
            margin-top: 15px;
            font-size: 1.1em;
            color: #ccc;
            transition: color 0.4s ease; 
        }
        .card-time {
            font-size: 0.9em;
            color: #888;
            background: #111;
            padding: 5px 12px;
            border-radius: 15px;
            display: inline-block;
            margin-top: 8px;
            font-family: monospace; 
        }

        /* --- Estilo da Carta ATIVA --- */
        .card-item.active {
            opacity: 1;
            transform: scale(1.15); 
            filter: drop-shadow(0 0 25px var(--glow-color)); 
            z-index: 10;
        }
        
        .card-item.active .card-name {
            color: var(--glow-color);
            font-weight: bold;
            font-size: 1.2em;
            text-shadow: 0 0 8px var(--glow-color);
        }
    </style>
</head>
<body>

    <div class="player-container">
        <h2>Episódio 227</h2>
        
        <audio id="podcast-audio" controls style="width: 100%;">
            <source src="https://traffic.libsyn.com/cotr/Episode_227_-_QC.mp3" type="audio/mpeg">
            Seu navegador não suporta o elemento de áudio.
        </audio>

        <div id="status-message">Carregando linha do tempo...</div>

        <div id="carousel-container" class="carousel"></div>
    </div>

    <script>
        let timelineCartas = [];
        let cartaAtualIndex = -1;
        
        const statusMessage = document.getElementById('status-message');
        const carousel = document.getElementById('carousel-container');
        const audioPlayer = document.getElementById('podcast-audio');

        function formatarTempo(segundosTotais) {
            const horas = Math.floor(segundosTotais / 3600);
            const minutos = Math.floor((segundosTotais % 3600) / 60);
            const segundos = Math.floor(segundosTotais % 60);
            
            const hh = horas.toString().padStart(2, '0');
            const mm = minutos.toString().padStart(2, '0');
            const ss = segundos.toString().padStart(2, '0');
            
            return `${hh}:${mm}:${ss}`;
        }

        function pegarCorDaEsfera(esfera) {
            const cores = {
                'leadership': '#ad62a5', // Roxo
                'tactics': '#c00106',    // Vermelho 
                'spirit': '#00b1d4',     // Azul
                'lore': '#51b848',       // Verde
                'neutral': '#616161',    // Cinza
                'fellowship': '#b56c0c', // Dourado
                'baggins': '#b39e26'     // Dourado
            };
            return cores[esfera?.toLowerCase()] || '#eebb55';
        }

        fetch('/api/timeline')
            .then(response => {
                if (!response.ok) throw new Error(`Erro: ${response.status}`);
                return response.json();
            })
            .then(dados => {
                timelineCartas = dados;
                statusMessage.textContent = `${timelineCartas.length} cartas sincronizadas. Aperte o Play!`;
                
                timelineCartas.forEach((carta, index) => {
                    const cardDiv = document.createElement('div');
                    cardDiv.className = 'card-item';
                    cardDiv.id = `card-${index}`;
                    
                    cardDiv.style.setProperty('--glow-color', pegarCorDaEsfera(carta.esfera));
                    
                    cardDiv.innerHTML = `
                        <img src="${carta.url}" alt="${carta.nome}">
                        <div class="card-name">${carta.nome}</div>
                        <div class="card-time">${formatarTempo(carta.tempo_segundos)}</div>
                    `;

                    cardDiv.addEventListener('click', () => {
                        audioPlayer.currentTime = carta.tempo_segundos;
                        audioPlayer.play();
                    });

                    carousel.appendChild(cardDiv);
                });
            })
            .catch(erro => {
                console.error("Erro:", erro);
                statusMessage.textContent = "Erro ao carregar a timeline.";
            });

        audioPlayer.addEventListener('timeupdate', () => {
            if (timelineCartas.length === 0) return;

            const tempoAtual = audioPlayer.currentTime;
            let indexCorreto = -1;
            
            for (let i = 0; i < timelineCartas.length; i++) {
                if (tempoAtual >= timelineCartas[i].tempo_segundos) {
                    indexCorreto = i;
                } else {
                    break;
                }
            }

            if (indexCorreto !== cartaAtualIndex) {
                
                if (cartaAtualIndex !== -1) {
                    const cartaAntiga = document.getElementById(`card-${cartaAtualIndex}`);
                    if (cartaAntiga) cartaAntiga.classList.remove('active');
                }

                cartaAtualIndex = indexCorreto;

                if (cartaAtualIndex !== -1) {
                    const cartaNova = document.getElementById(`card-${cartaAtualIndex}`);
                    if (cartaNova) {
                        cartaNova.classList.add('active');
                        
                        const posicaoCentro = cartaNova.offsetLeft - (carousel.clientWidth / 2) + (cartaNova.clientWidth / 2);
                        
                        carousel.scrollTo({
                            left: posicaoCentro,
                            behavior: 'smooth'
                        });
                    }
                }
            }
        });
    </script>
</body>
</html>
