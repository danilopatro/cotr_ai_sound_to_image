<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cardboard of the Rings - AI Player</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #1a1a1a;
            color: #f1f1f1;
            padding: 40px;
            margin: 0;
        }

        .layout-wrapper {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1300px; 
            align-items: flex-start;
        }

        .player-container {
            flex: 1; 
            min-width: 0; 
            background: #2a2a2a;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
        }
        
        .player-container h2 {
            margin-bottom: 5px;
            color: #eebb55;
        }
        
        .player-container h4 {
            margin-top: 0;
            margin-bottom: 25px;
            color: #aaa;
            font-weight: normal;
        }

        .sidebar {
            width: 280px;
            background: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-height: 75vh;
            overflow-y: auto;
            flex-shrink: 0; 
        }

        .sidebar::-webkit-scrollbar { width: 8px; }
        .sidebar::-webkit-scrollbar-track { background: #1a1a1a; border-radius: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        .sidebar::-webkit-scrollbar-thumb:hover { background: #777; }

        .sidebar h3 {
            margin-top: 0;
            color: #eebb55;
            text-align: center;
            border-bottom: 1px solid #444;
            padding-bottom: 15px;
        }

        .sidebar-item {
            padding: 12px;
            border-bottom: 1px solid #333;
            cursor: pointer;
            transition: all 0.2s ease;
            border-left: 4px solid transparent; 
        }
        
        .sidebar-item:hover { background: #333; }

        .sidebar-item.active {
            background: #1f1f1f;
            border-left: 4px solid var(--glow-color); 
        }

        .sidebar-item.active .sidebar-name {
            color: #fff;
            font-weight: bold;
        }

        .sidebar-time {
            font-size: 0.85em;
            color: #888;
            font-family: monospace;
            background: #111;
            padding: 3px 8px;
            border-radius: 6px;
        }

        .sidebar-name {
            display: block;
            margin-top: 6px;
            font-size: 0.95em;
            color: #ccc;
        }

        #status-message {
            margin: 15px 0;
            font-weight: bold;
            color: #eebb55;
            font-size: 1.2em;
        }

        .carousel {
            position: relative; 
            display: flex;
            overflow-x: auto;
            gap: 30px; 
            padding: 60px 20px; 
            width: 100%;
            align-items: center; 
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .carousel::-webkit-scrollbar { display: none; }

        .card-item {
            flex: 0 0 auto; 
            opacity: 0.4; 
            transform: scale(0.9);
            transition: all 0.4s ease-in-out;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card-images-wrapper {
            display: flex;
            gap: 15px; 
            justify-content: center;
        }

        .card-item img {
            width: 280px; 
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.6);
            object-fit: contain;
        }

        .split-card {
            width: 280px;
            height: 392px; 
            background-size: 100% 200%; 
            background-repeat: no-repeat;
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.6);
        }

        .card-name {
            margin-top: 15px;
            font-size: 1.1em;
            color: #ccc;
            transition: all 0.4s ease;
            text-align: center;
            max-width: 90%;
        }
        
        .card-time {
            font-size: 0.9em;
            color: #888;
            background: #111;
            padding: 5px 12px;
            border-radius: 15px;
            display: inline-block;
            margin-top: 8px;
            margin-bottom: 12px; /* Espaço pro link abaixo */
            font-family: monospace; 
        }

        /* --- NOVO: Estilos do Link do RingsDB --- */
        .ringsdb-links {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
        }

        .ringsdb-btn {
            font-size: 0.8em;
            color: #00b1d4; /* Azul de link agradável */
            text-decoration: none;
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 5px 12px;
            border-radius: 20px;
            transition: all 0.2s ease;
            display: inline-block;
        }

        .ringsdb-btn:hover {
            background: #00b1d4;
            color: #111;
            border-color: #00b1d4;
            font-weight: bold;
        }

        .card-item.active {
            opacity: 1;
            transform: scale(1.12); 
            filter: drop-shadow(0 0 25px var(--glow-color)); 
            z-index: 10;
        }
        
        .card-item.active .card-name {
            color: #ffffff; 
            font-weight: bold;
            font-size: 1.2em;
            text-shadow: 0 0 8px var(--glow-color);
        }

        @media (max-width: 950px) {
            .layout-wrapper { flex-direction: column; }
            .sidebar { width: 100%; max-height: 350px; box-sizing: border-box; }
        }
    </style>
</head>
<body>

    <div class="layout-wrapper">
        <div class="player-container">
            <!-- Título e Subtítulo atualizados -->
            <h2>Episódio 256</h2>
            <h4>Seastan and Dale vs Evil</h4>
            
            <audio id="podcast-audio" controls style="width: 100%;">
                <!-- Link do MP3 atualizado -->
                <source src="https://traffic.libsyn.com/cotr/Cardboard_of_the_Rings_256.mp3" type="audio/mpeg">
                Seu navegador não suporta o elemento de áudio.
            </audio>

            <div id="status-message">Carregando linha do tempo...</div>
            <div id="carousel-container" class="carousel"></div>
        </div>

        <div class="sidebar">
            <h3>Índice de Cartas</h3>
            <div id="sidebar-list"></div>
        </div>
    </div>

    <script>
        let timelineAgrupada = [];
        let cartaAtualIndex = -1;
        
        const statusMessage = document.getElementById('status-message');
        const carousel = document.getElementById('carousel-container');
        const audioPlayer = document.getElementById('podcast-audio');
        const sidebarList = document.getElementById('sidebar-list');

        function formatarTempo(segundosTotais) {
            if (isNaN(segundosTotais)) return "00:00:00";
            const horas = Math.floor(segundosTotais / 3600);
            const minutos = Math.floor((segundosTotais % 3600) / 60);
            const segundos = Math.floor(segundosTotais % 60);
            return `${horas.toString().padStart(2, '0')}:${minutos.toString().padStart(2, '0')}:${segundos.toString().padStart(2, '0')}`;
        }

        function pegarCorDaEsfera(esfera) {
            const cores = {
                'leadership': '#ad62a5', 
                'tactics': '#c00106',    
                'spirit': '#00b1d4',     
                'lore': '#51b848',       
                'neutral': '#616161',    
                'fellowship': '#b56c0c', 
                'baggins': '#b39e26'     
            };
            return cores[esfera?.toLowerCase()] || '#eebb55';
        }

        carousel.addEventListener('wheel', (evt) => {
            evt.preventDefault(); 
            carousel.scrollLeft += evt.deltaY; 
        });

        fetch('/api/timeline')
            .then(response => {
                if (!response.ok) throw new Error(`Erro: ${response.status}`);
                return response.json();
            })
            .then(dadosRaw => {
                const mapaAgrupado = {};
                
                dadosRaw.forEach(carta => {
                    const tempo = parseInt(carta.tempo_segundos);
                    if (isNaN(tempo)) return;

                    if (!mapaAgrupado[tempo]) {
                        mapaAgrupado[tempo] = { tempo_segundos: tempo, cartas: [] };
                    }
                    if (!mapaAgrupado[tempo].cartas.some(c => c.nome === carta.nome)) {
                        mapaAgrupado[tempo].cartas.push(carta);
                    }
                });

                timelineAgrupada = Object.values(mapaAgrupado).sort((a, b) => a.tempo_segundos - b.tempo_segundos);

                if (timelineAgrupada.length === 0) {
                    statusMessage.textContent = "Nenhuma carta encontrada.";
                    return;
                }

                statusMessage.textContent = `${timelineAgrupada.length} momentos sincronizados. Aperte o Play!`;
                
                timelineAgrupada.forEach((grupo, index) => {
                    
                    const cardDiv = document.createElement('div');
                    cardDiv.className = 'card-item';
                    cardDiv.id = `card-${index}`;
                    
                    const corPrincipal = pegarCorDaEsfera(grupo.cartas[0].esfera);
                    cardDiv.style.setProperty('--glow-color', corPrincipal);
                    
                    let nomesHTML = grupo.cartas.map(c => c.nome).join(' & ');
                    
                    // 💡 NOVO: Gerador dos botões do RingsDB
                    let linksRingsDbHTML = '';

                    // Injeta estrutura do HTML
                    cardDiv.innerHTML = `
                        <div class="card-images-wrapper"></div>
                        <div class="card-name">${nomesHTML}</div>
                        <div class="card-time">${formatarTempo(grupo.tempo_segundos)}</div>
                        <div class="ringsdb-links"></div>
                    `;

                    const imageWrapper = cardDiv.querySelector('.card-images-wrapper');
                    const linksWrapper = cardDiv.querySelector('.ringsdb-links');

                    grupo.cartas.forEach(carta => {
                        const urlSegura = carta.url ? carta.url : '';
                        
                        if (urlSegura) {
                            // Imagens e Separação
                            const img = document.createElement('img');
                            img.src = urlSegura;
                            img.alt = carta.nome;

                            img.onload = function() {
                                if (this.naturalHeight > this.naturalWidth * 1.8) {
                                    const doubleContainer = document.createElement('div');
                                    doubleContainer.style.display = 'flex';
                                    doubleContainer.style.gap = '15px';
                                    
                                    const topHalf = document.createElement('div');
                                    topHalf.className = 'split-card';
                                    topHalf.style.backgroundImage = `url('${this.src}')`;
                                    topHalf.style.backgroundPosition = 'top';
                                    
                                    const bottomHalf = document.createElement('div');
                                    bottomHalf.className = 'split-card';
                                    bottomHalf.style.backgroundImage = `url('${this.src}')`;
                                    bottomHalf.style.backgroundPosition = 'bottom';
                                    
                                    doubleContainer.appendChild(topHalf);
                                    doubleContainer.appendChild(bottomHalf);
                                    
                                    this.replaceWith(doubleContainer);
                                }
                            };
                            imageWrapper.appendChild(img);

                            // 💡 Criando o Link com o ID da carta:
                            // Pega a URL (ex: "https://ringsdb.com/bundles/cards/01026.png") e extrai apenas o "01026"
                            const partesDaUrl = urlSegura.split('/');
                            const arquivoImagem = partesDaUrl[partesDaUrl.length - 1]; // "01026.png"
                            const idDaCarta = arquivoImagem.split('.')[0]; // "01026"

                            linksWrapper.innerHTML += `
                                <a href="https://ringsdb.com/card/${idDaCarta}" target="_blank" class="ringsdb-btn" onclick="event.stopPropagation();">
                                    Ver <strong>${carta.nome}</strong> no RingsDB
                                </a>
                            `;
                        }
                    });

                    // Clicar em qualquer parte vazia do card pula o áudio (mas ignorado nos links por causa do stopPropagation)
                    cardDiv.addEventListener('click', () => {
                        audioPlayer.currentTime = grupo.tempo_segundos;
                        audioPlayer.play();
                    });

                    carousel.appendChild(cardDiv);

                    // ÍNDICE LATERAL
                    const sidebarItem = document.createElement('div');
                    sidebarItem.className = 'sidebar-item';
                    sidebarItem.id = `sidebar-item-${index}`;
                    sidebarItem.style.setProperty('--glow-color', corPrincipal);
                    
                    sidebarItem.innerHTML = `
                        <span class="sidebar-time">${formatarTempo(grupo.tempo_segundos)}</span>
                        <span class="sidebar-name">${nomesHTML}</span>
                    `;

                    sidebarItem.addEventListener('click', () => {
                        audioPlayer.currentTime = grupo.tempo_segundos;
                        audioPlayer.play();
                    });

                    sidebarList.appendChild(sidebarItem);
                });

                audioPlayer.dispatchEvent(new Event('timeupdate'));
            })
            .catch(erro => {
                console.error("Erro:", erro);
                statusMessage.textContent = "Erro ao carregar a timeline.";
            });

        audioPlayer.addEventListener('timeupdate', () => {
            if (timelineAgrupada.length === 0) return;

            const tempoAtual = audioPlayer.currentTime;
            let indexCorreto = 0; 
            
            for (let i = 0; i < timelineAgrupada.length; i++) {
                if (tempoAtual >= timelineAgrupada[i].tempo_segundos) {
                    indexCorreto = i;
                } else {
                    break;
                }
            }

            if (indexCorreto !== cartaAtualIndex) {
                if (cartaAtualIndex !== -1) {
                    const cardAntigo = document.getElementById(`card-${cartaAtualIndex}`);
                    if (cardAntigo) cardAntigo.classList.remove('active');

                    const sidebarAntigo = document.getElementById(`sidebar-item-${cartaAtualIndex}`);
                    if (sidebarAntigo) sidebarAntigo.classList.remove('active');
                }

                cartaAtualIndex = indexCorreto;

                if (cartaAtualIndex !== -1) {
                    const cardNovo = document.getElementById(`card-${cartaAtualIndex}`);
                    if (cardNovo) {
                        cardNovo.classList.add('active');
                        const posicaoCentro = cardNovo.offsetLeft - (carousel.clientWidth / 2) + (cardNovo.clientWidth / 2);
                        carousel.scrollTo({ left: posicaoCentro, behavior: 'smooth' });
                    }

                    const sidebarNovo = document.getElementById(`sidebar-item-${cartaAtualIndex}`);
                    if (sidebarNovo) {
                        sidebarNovo.classList.add('active');
                        sidebarNovo.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }
                }
            }
        });
    </script>
</body>
</html>
